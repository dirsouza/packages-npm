name: CI

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - develop  # recebe PRs de feat/** e fix/**
      - main     # recebe PRs de develop e hotfix/**
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Valida que PRs para main só vêm de develop ou hotfix/* ─────────────────
  validate-source-branch:
    name: Validate source branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check allowed source branches
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"
          echo "Branch de origem: $SOURCE → destino: $TARGET"

          if [[ "$TARGET" == "main" ]]; then
            if [[ "$SOURCE" != "develop" && "$SOURCE" != hotfix/* ]]; then
              echo "❌ PRs para 'main' só são permitidos de 'develop' ou 'hotfix/*'."
              echo "   Branch atual: $SOURCE"
              exit 1
            fi
          fi

          if [[ "$TARGET" == "develop" ]]; then
            if [[ "$SOURCE" != feat/* && "$SOURCE" != fix/* ]]; then
              echo "❌ PRs para 'develop' só são permitidos de 'feat/*' ou 'fix/*'."
              echo "   Branch atual: $SOURCE"
              exit 1
            fi
          fi

          echo "✅ Branch de origem autorizada: $SOURCE → $TARGET"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies (Fyne / OpenGL)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev

      - name: Check formatting (go fmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Os seguintes arquivos precisam de formatação (rode 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: packages-npm-linux
          - os: macos-latest
            binary: packages-npm-darwin
          - os: windows-latest
            binary: packages-npm-windows.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -v -o bin/${{ matrix.binary }} ./cmd/app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: bin/${{ matrix.binary }}
          retention-days: 7
