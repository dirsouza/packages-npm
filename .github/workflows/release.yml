name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: packages-npm-linux-amd64.tar.xz
          - os: macos-latest
            artifact: packages-npm-darwin-arm64.dmg
          - os: windows-latest
            artifact: packages-npm-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ── Linux dependencies ────────────────────────────────────────────────
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev

      # ── Windows: GCC via MSYS2 ────────────────────────────────────────────
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Add MINGW64 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Install fyne CLI ──────────────────────────────────────────────────
      - name: Install fyne CLI (Linux / macOS)
        if: runner.os != 'Windows'
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install fyne CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go install fyne.io/tools/cmd/fyne@latest

      # fyne package precisa do FyneApp.toml junto do source; sem ele (ou com
      # TOML inválido — Build deve ser inteiro) o bundle sai como "app" e sem
      # metadados (com.example.app)
      - name: Copy FyneApp.toml into source dir
        shell: bash
        run: cp FyneApp.toml cmd/app/

      # ── macOS: .app bundle → .dmg ─────────────────────────────────────────
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          fyne package --src ./cmd/app
          mkdir -p dist
          APP=$(find . -maxdepth 1 -name "*.app" | head -1)
          codesign --force --deep --sign "-" "$APP"
          hdiutil create \
            -volname "Packages NPM" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "dist/packages-npm-darwin-arm64.dmg"

      # ── Linux: .tar.xz com .desktop entry ────────────────────────────────
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          fyne package --src ./cmd/app
          echo "=== arquivos gerados ===" && ls -la . cmd/app
          mkdir -p dist
          TAR=$(find . -maxdepth 2 -not -path "./dist/*" \( -name "*.tar.xz" -o -name "*.tar.gz" \) | head -1)
          if [ -z "$TAR" ]; then echo "ERRO: nenhum tarball gerado"; exit 1; fi
          mv "$TAR" dist/packages-npm-linux-amd64.tar.xz

      # ── Windows: .exe com ícone embutido ─────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$(go env GOPATH)\bin"
          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"
          fyne package --src ./cmd/app
          if ($LASTEXITCODE -ne 0) { Write-Error "ERRO: fyne package falhou (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "=== arquivos gerados ==="
          Get-ChildItem -Recurse -Depth 2 -File |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            Select-Object -ExpandProperty FullName | Out-String | Write-Host
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Recurse -Depth 2 -Filter "*.exe" -File |
            Where-Object { $_.FullName -notmatch '\\dist\\' -and $_.Name -notmatch '-bin\.exe$' } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "ERRO: nenhum .exe gerado"; exit 1 }
          Write-Host "=== usando: $($exe.FullName) ==="
          Move-Item $exe.FullName dist/packages-npm-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "packages-npm ${{ github.ref_name }}"
          body: |
            ## packages-npm ${{ github.ref_name }}

            ### Downloads

            | Plataforma | Arquivo | Tipo |
            |---|---|---|
            | 🍎 macOS (Apple Silicon) | `packages-npm-darwin-arm64.dmg` | Disk Image (arraste para /Applications) |
            | 🐧 Linux | `packages-npm-linux-amd64.tar.xz` | Tarball + .desktop entry |
            | 🪟 Windows | `packages-npm-windows-amd64.exe` | Executável com ícone embutido |

            ### Instalação

            **macOS**
            1. Abra `packages-npm-darwin-arm64.dmg`
            2. Arraste `Packages NPM.app` para `/Applications`
            3. Na primeira abertura o macOS avisará que não pôde verificar o app (o app não é notarizado pela Apple). Clique **OK** e então:
               - Abra **Ajustes do Sistema → Privacidade e Segurança**, role até o final e clique **Abrir Assim Mesmo**; **ou**
               - No Terminal: `xattr -dr com.apple.quarantine "/Applications/Packages NPM.app"`

            **Linux**
            ```bash
            mkdir packages-npm && tar -xJf packages-npm-linux-amd64.tar.xz -C packages-npm
            cd packages-npm
            sudo make install   # instala binário, ícone e .desktop em /usr/local
            # Ou execute direto o binário em usr/local/bin/ sem instalar
            ```

            **Windows**
            Execute `packages-npm-windows-amd64.exe` diretamente — sem instalação necessária.

            ---
            **Requisito:** [Node.js / npm](https://nodejs.org/) instalado no sistema.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/packages-npm-linux-amd64.tar.xz
            dist/packages-npm-darwin-arm64.dmg
            dist/packages-npm-windows-amd64.exe
